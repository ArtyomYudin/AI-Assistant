services:
  # === LLM Qwen на GPU0 ===
  llm:
    image: nalanzeyu/vllm-gfx906
    container_name: llm
#    command: >
#      vllm serve /models/Qwen/Qwen3-8B-AWQ
#      --gpu-memory-utilization 0.90
#      --max-model-len 16384
#      --max-num-batched-tokens 16384
#      --max-num-seqs 32
#      --enable-prefix-caching
#      --disable-log-requests
#      --port 8001
#      --served-model-name Qwen3-8B-AWQ
    command: >
      vllm serve /models/pimenovdv/T-lite-it-2.1-AWQ-4bits
      --gpu-memory-utilization 0.90
      --max-model-len 16384
      --max-num-batched-tokens 16384
      --max-num-seqs 32
      --enable-prefix-caching
      --disable-log-requests
      --port 8001
      --served-model-name T-lite-it-2.1-AWQ
      --enable-auto-tool-choice
      --tool-call-parser hermes
    environment:
      - HSA_OVERRIDE_GFX_VERSION=9.0.6    # КРИТИЧНО ДЛЯ MI50
      - ROCR_VISIBLE_DEVICES=0            # Родной синтаксис ROCm
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8001:8001"
    volumes:
      - /storage/models:/models
    shm_size: "16g"
    ipc: host
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
