#      - ROCR_VISIBLE_DEVICES=0
#    cap_add:
#      - SYS_PTRACE
#    security_opt:
#      - seccomp=unconfined
#      - apparmor=unconfined
#    shm_size: "16g"
#    ipc: host

  # === FRIDA Embeddings на GPU1 ===
  frida-embeddings:
    build:
      context: ./docker/frida-embed
      dockerfile: Dockerfile
    container_name: embeddings
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    shm_size: "8g"
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_PTRACE
    environment:
      - HSA_OVERRIDE_GFX_VERSION=9.0.6    # КРИТИЧНО ДЛЯ MI50
      - ROCR_VISIBLE_DEVICES=1
      - HIP_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=1
      - MODEL_NAME=ai-forever/FRIDA
    volumes:
      - /storage/models:/models
    ports:
      - "8000:8000"
    command: >
      uvicorn server:app --host 0.0.0.0 --port 8000

  # === BGE Reranker на GPU1 ===
  reranker:
    image: nalanzeyu/vllm-gfx906:v0.10.1.update2-rocm6.3
    container_name: reranker
    command: >
      vllm serve /models/BAAI/bge-reranker-v2-m3
      --task score
      --pooler-config.task classify
      --swap-space 4
      --disable-log-requests
      --dtype float16
      --gpu-memory-utilization=0.35
      --max-num-batched-tokens 32768
      --max-num-seqs 512
      --port 8002
      --served-model-name bge-reranker-v2-m3
    environment:
      - HSA_OVERRIDE_GFX_VERSION=9.0.6    # КРИТИЧНО ДЛЯ MI50
      - CUDA_VISIBLE_DEVICES=1
      - VLLM_USE_V1=0
      - VLLM_USE_TRITON_FLASH_ATTN=0
    ports:
      - "8002:8002"
    volumes:
      - /storage/models:/models
    shm_size: "16g"
    ipc: host
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

# === Milvus (Vector DB) ===
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: milvus
    restart: unless-stopped
    environment:
      - MILVUS_LOG_LEVEL=info
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=milvus
      - MQ_TYPE=woodpecker
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # REST
    volumes:
      - /storage/milvus:/var/lib/milvus
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "2379:2379"
    volumes:
      - /storage/etcd:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9001/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /storage/minio:/minio_data

  # === Redis (кэш + история чата) ===
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /storage/redis:/data

  # RAG FastAPI
  rag-api:
#    build:
#      context: .
#      dockerfile: docker/Dockerfile
    image: hanna.center-inform.ru/ai-assistant/rag:latest
    container_name: rag-api
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
      - MODE=hybrid
      - MAX_HISTORY_MESSAGES=1
      - LLM_MAX_TOKEN=2048
      - LLM_TEMPERATURE=0.7
      - MAX_CONTEXT_TOKENS=12800
      - RESERVED_FOR_COMPLETION=2048
    ports:
      - "8008:8008"
    command: >
      uvicorn api.app:app --host 0.0.0.0 --port 8008 --log-level debug
    depends_on:
      - llm
      - frida-embeddings
      - reranker
      - redis
      - milvus

  # Gradio UI
  rag-gradio:
#      build:
#        context: .
#        dockerfile: docker/Dockerfile  # можно использовать тот же Dockerfile
      image: hanna.center-inform.ru/ai-assistant/rag:latest
      container_name: rag-gradio
      restart: unless-stopped
      environment:
        - PYTHONUNBUFFERED=1
        - LOG_LEVEL=DEBUG
        - MODE=hybrid
        - MAX_HISTORY_MESSAGES=1
        - LLM_MAX_TOKEN=2048
        - LLM_TEMPERATURE=0.7
        - MAX_CONTEXT_TOKENS=12800
        - RESERVED_FOR_COMPLETION=2048
      ports:
        - "7860:7860"  # Gradio по умолчанию слушает 7860
      command: python -m ui.app  # запуск Gradio-приложения
      depends_on:
        - rag-api